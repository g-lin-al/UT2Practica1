<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ejercicio 5</title>
</head>
<body>
    <p id="resultados"></p>

    <script>
        let numero = 1;

        do {
            numero = prompt("Introducir número (salir -> 0)");
            if (numero != 0) {
                document.getElementById("resultados").innerHTML += `${numero}&nbsp;`;
            }
        } while (numero != 0);
    </script>
</body>
</html>
